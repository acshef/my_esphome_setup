    accuracy_decimals: 6
    filters:
      - min:
          window_size: 1000
          send_every: 1
          send_first_at: 1
  - platform: copy
    name: $SENSOR_A Acceleration Y (Maximum)
    source_id: accel_a_y
    state_class: measurement
    icon: mdi:axis-y-arrow
    accuracy_decimals: 6
    filters:
      - max:
          window_size: 1000
          send_every: 1
          send_first_at: 1
  - platform: copy
    name: $SENSOR_A Acceleration Y (Average)
    source_id: accel_a_y
    state_class: measurement
    icon: mdi:axis-y-arrow
    accuracy_decimals: 6
    filters:
      - throttle_average: 10s
      - filter_out: nan
  - platform: copy
    name: $SENSOR_A Acceleration Z (Minimum)
    source_id: accel_a_z
    state_class: measurement
    icon: mdi:axis-z-arrow
    accuracy_decimals: 6
    filters:
      - min:
          window_size: 1000

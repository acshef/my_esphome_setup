binary_sensor:
  - platform: template
    name: $SENSOR_A
    id: binary_a
    icon: $ICON_A
    lambda: |
      return id(binary_a_raw);
  - platform: template
    name: $SENSOR_B
    id: binary_b
    icon: $ICON_B
    lambda: |
      return id(binary_b_raw);

button:
  - platform: template
    name: Recalibrate
    entity_category: config
    icon: mdi:cube-scan
    on_press:
      - script.execute: calibrate
  - platform: template
    name: Wake Screen
    entity_category: config
    icon: mdi:eye-refresh
    on_press:
      - script.execute: wake_screen

font:
  # - file: https://raw.githubusercontent.com/trip5/Matrix-Fonts/refs/heads/main/6-series/MatrixLight6.bdf
  #   id: matrix_6
  #   size: 6
  - file: https://raw.githubusercontent.com/trip5/Matrix-Fonts/refs/heads/main/8-series/MatrixLight8x6.bdf
    id: matrix_8
    size: 8
  - file: "gfonts://Roboto@600"
    id: roboto_18
    size: 18
  # - file: "gfonts://Roboto"
  #   id: roboto_12
  #   size: 12

display:
  - platform: ssd1306_i2c
    model: "SSD1306 72x40"
    id: my_display
    rotation: 0
    update_interval: 1s
    offset_y: 0
    offset_x: 0
    invert: false
    address: 0x3C
    lambda: |-
      static uint8_t page = 0;
      const uint8_t MAX_PAGES = 2;
      const uint32_t DISPLAY_TIMEOUT = 60000;
      auto millis_since_change = millis() - std::max({
        id(washer_state_change),
        id(dryer_state_change),
        id(last_screen_on),
      });

      const char *washer_stages[] = {
        "OFF",
      };

      const char *dryer_stages[] = {
        "OFF",
        "START",
        "ON",
        "DONE"
      };

      if (millis_since_change > DISPLAY_TIMEOUT) {
        id(my_display).turn_off();
        ESP_LOGD("main", "It's been 60 seconds, putting display back to sleep");
      } else {
        if (!id(my_display).is_on()) {
          id(my_display).turn_on();
        }
        it.filled_rectangle(0,0,72,10);
        if (page == 0) {
          // Washer
          it.filled_triangle(0, 25, 5, 20, 5, 30);
          it.print(36, 1, id(matrix_8), COLOR_OFF, TextAlign::TOP_CENTER, "WASHER");
          it.print(38, 15, id(roboto_18), TextAlign::TOP_CENTER, washer_stages[id(washer_state)]);
        } else if (page == 1) {
          // Dryer
          it.filled_triangle(71, 25, 66, 20, 66, 30);
          it.print(36, 1, id(matrix_8), COLOR_OFF, TextAlign::TOP_CENTER, "DRYER", COLOR_ON);
          it.print(34, 15, id(roboto_18), TextAlign::TOP_CENTER, dryer_stages[id(dryer_state)]);
        }
        it.line(0,39,72 - (int)std::ceil(float(millis_since_change) / DISPLAY_TIMEOUT * 72.0), 39);
        page = (page + 1) % MAX_PAGES;
      }

status_led:
  pin:
    number: GPIO8
    inverted: yes

  - platform: copy
    name: $SENSOR_A Acceleration X (Average)
    source_id: accel_a_x
    state_class: measurement
    icon: mdi:axis-x-arrow
    accuracy_decimals: 6
    filters:
      - throttle_average: 10s
      - filter_out: nan
  - platform: copy

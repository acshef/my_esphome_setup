    icon: mdi:axis-z-arrow
    accuracy_decimals: 6
    filters:
      - max:
          window_size: 1000
          send_every: 1
          send_first_at: 1
  - platform: copy
    name: $SENSOR_A Acceleration Z (Average)
    source_id: accel_a_z
    state_class: measurement
    icon: mdi:axis-z-arrow
    accuracy_decimals: 6
    filters:
      - throttle_average: 10s
      - filter_out: nan
  - platform: copy
    name: $SENSOR_A Acceleration Delta
    source_id: accel_a_delta
    state_class: measurement
    icon: mdi:delta
    unit_of_measurement: m/s²
    disabled_by_default: true
    filters:
      - throttle_average: 10s
      - filter_out: nan
  - platform: copy
    name: $SENSOR_A Gyroscope
    source_id: gyro_a_magnitude
    state_class: measurement
    icon: mdi:rotate-orbit
    unit_of_measurement: °/s
    filters:
      - throttle_average: 10s
      - filter_out: nan
  - platform: copy
    name: $SENSOR_A Gyroscope Delta
    source_id: gyro_a_delta
    state_class: measurement
    icon: mdi:delta
    unit_of_measurement: °/s
    disabled_by_default: true
    filters:
      - throttle_average: 10s
      - filter_out: nan
  - platform: copy
    name: $SENSOR_A Temperature
    source_id: temperature_a_raw
    state_class: measurement
    device_class: temperature
    filters:
      - throttle_average: 10s
      - filter_out: nan
    # SENSOR B, Address 0x69, SA0=3V3
  - platform: my_bmi160
    address: 0x69
    update_interval: 10ms
    acceleration_x:
      id: accel_b_x
    acceleration_y:

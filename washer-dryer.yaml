  #     - throttle_average: $AVERAGE_INTERVAL
  #     - filter_out: nan
  #     - offset: !lambda return id(gyro_b_z_offset).get_state();
  # - <<: *sensor_offset
  #   id: gyro_b_z_offset
  #   name: $SENSOR_B Gyro Z Offset

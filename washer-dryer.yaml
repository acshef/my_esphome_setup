binary_sensor:
  - platform: template
    name: $SENSOR_A
    id: binary_a
    icon: $ICON_A
    lambda: |
      return id(binary_a_raw);
  - platform: template
    name: $SENSOR_B
    id: binary_b
    icon: $ICON_B
    lambda: |
      return id(binary_b_raw);

button:
  - platform: template
    name: Recalibrate
    entity_category: config
    icon: mdi:cube-scan
    on_press:
      - script.execute: calibrate

status_led:
  pin:
    number: D4
    inverted: yes

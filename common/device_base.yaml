esphome:
  name: $NODE_NAME
  name_add_mac_suffix: false
  friendly_name: $FRIENDLY_NAME
  build_path: .build/${NODE_NAME}/
  on_boot:
    - then:
        - text_sensor.template.publish:
            id: config_hash
            state: !lambda |-
              // PRIx32 is format conversion specifier to output an unsigned lowercase hexadecimal integer value of type
              // See: https://en.cppreference.com/w/cpp/header/cinttypes.html
              // If we wanted uppercase hex, we'd use "PRIX32" instead.
              // This is equivalent to "x" for unsigned ints, but apparently it's safer to use this constant
              // than to use a literal "x"
              return str_sprintf("0x%08" PRIx32, App.get_config_hash());
        - text_sensor.template.publish:
            id: esp_version
            state: !lambda |-
              return {ESPHOME_VERSION};

substitutions:
  # NODE_NAME
  FRIENDLY_NAME: $NODE_NAME
  LOG_LEVEL: NONE

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  post_connect_roaming: false
  min_auth_mode: WPA2
  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "$NODE_NAME AP"
    password: !secret wifi_password

external_components:
  - source: my_components

captive_portal:

logger:
  level: $LOG_LEVEL

# Enable Home Assistant API
api:

# https://esphome.io/components/time/homeassistant
time:
  - platform: homeassistant
    id: homeassistant_time

ota:
  platform: esphome

button:
  - platform: restart
    id: restart_button
    name: Restart

binary_sensor:
  - platform: status
    name: Status
    entity_category: diagnostic

sensor:
  - platform: wifi_signal
    id: wifi_strength
    name: Wifi Signal
    update_interval: 60s
    entity_category: diagnostic
  - platform: uptime
    id: uptime_raw
    update_interval: 60s
    type: seconds
    on_raw_value:
      then:
        - text_sensor.template.publish:
            id: uptime_human
            state: !lambda |-
              int seconds = round(id(uptime_raw).get_raw_state());
              int weeks = seconds / 604800; // 7 * 24 * 3600 = 604800
              seconds = seconds % 604800;   // 7 * 24 * 3600 = 604800
              int days = seconds / 86400;   // 24 * 60 * 60 = 86400
              seconds = seconds % 86400;    // 24 * 60 * 60 = 86400
              int hours = seconds / 3600;   // 60 * 60 = 3600
              seconds = seconds % 3600;     // 60 * 60 = 3600
              int minutes = seconds / 60;
              seconds = seconds % 60;
              if (weeks > 0) {
                return (std::to_string(weeks) + "w " + std::to_string(days) + "d").c_str();
              }
              if (days > 0) {
                return (std::to_string(days) + "d " + std::to_string(hours) + "h").c_str();
              }
              if (hours > 0) {
                return (std::to_string(hours) + "h " + std::to_string(minutes) + "m").c_str();
              }
              if (minutes > 0) {
                return (std::to_string(minutes) + "m " + std::to_string(seconds) + "s").c_str();
              }
              return (std::to_string(seconds) + "s").c_str();

text_sensor:
  - platform: template
    name: ESPHome Version
    icon: mdi:new-box
    id: esp_version
    entity_category: diagnostic
    update_interval: never
    lambda: "return {};"
  - platform: template
    id: config_hash
    name: Config Hash
    disabled_by_default: true
    icon: mdi:file-compare
    entity_category: diagnostic
    update_interval: never
    lambda: "return {};"
  - platform: wifi_info
    ip_address:
      name: IP Address
      id: ip_address
      icon: "mdi:ip-network"
      entity_category: diagnostic
    mac_address:
      name: MAC Address
      id: mac_address
      icon: "mdi:tag-text"
      entity_category: diagnostic
  - platform: template
    name: Uptime
    id: uptime_human
    icon: mdi:timer-outline
    entity_category: diagnostic
    update_interval: never
    lambda: 'return {"0s"};'
